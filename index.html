<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Counter App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <main class="w-full max-w-sm bg-slate-800/80 backdrop-blur-md rounded-3xl p-8 border border-slate-700/60 shadow-2xl text-center flex flex-col items-center gap-6">
    
    <!-- App Header -->
    <header class="space-y-1">
      <h1 class="text-xs font-bold uppercase tracking-widest text-indigo-400">Interactive App</h1>
      <h2 class="text-2xl font-bold text-slate-100">Simple Counter</h2>
    </header>

    <!-- Count Display Box -->
    <div class="w-full bg-slate-900/90 rounded-2xl p-6 border border-slate-700/40 shadow-inner flex flex-col items-center justify-center min-h-[140px] transition-all duration-300">
      <span id="counter-value" class="text-7xl font-extrabold text-indigo-400 tracking-tight transition-all duration-150 transform scale-100 select-none">
        0
      </span>
      <span id="status-tag" class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-2">
        Zero
      </span>
    </div>

    <!-- Action Controls -->
    <div class="grid grid-cols-2 gap-4 w-full">
      <!-- Decrement Button -->
      <button 
        id="btn-decrement" 
        class="flex items-center justify-center gap-2 bg-slate-700 hover:bg-rose-600 text-slate-200 hover:text-white font-bold py-4 px-6 rounded-2xl border border-slate-600/50 hover:border-rose-500 active:scale-95 transition-all shadow-md focus:outline-none focus:ring-2 focus:ring-rose-400/50"
        aria-label="Decrement count"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
        </svg>
        <span class="text-lg">Subtract</span>
      </button>

      <!-- Increment Button -->
      <button 
        id="btn-increment" 
        class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-6 rounded-2xl border border-indigo-500/50 active:scale-95 transition-all shadow-lg shadow-indigo-600/30 focus:outline-none focus:ring-2 focus:ring-indigo-400/50"
        aria-label="Increment count"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span class="text-lg">Add</span>
      </button>
    </div>

    <!-- Reset Button -->
    <button 
      id="btn-reset" 
      class="text-xs font-semibold text-slate-400 hover:text-slate-200 underline underline-offset-4 transition-colors pt-1 focus:outline-none"
    >
      Reset Counter
    </button>
  </main>

  <script>
    let count = 0;

    const counterDisplay = document.getElementById('counter-value');
    const statusTag = document.getElementById('status-tag');
    const btnIncrement = document.getElementById('btn-increment');
    const btnDecrement = document.getElementById('btn-decrement');
    const btnReset = document.getElementById('btn-reset');

    function updateCounterUI() {
      // Update text
      counterDisplay.textContent = count;

      // Pulse animation effect
      counterDisplay.classList.add('scale-110');
      setTimeout(() => counterDisplay.classList.remove('scale-110'), 150);

      // Color dynamically based on state
      if (count > 0) {
        counterDisplay.className = 'text-7xl font-extrabold text-emerald-400 tracking-tight transition-all duration-150 transform select-none';
        statusTag.textContent = 'Positive';
        statusTag.className = 'text-xs font-semibold text-emerald-500 uppercase tracking-wider mt-2';
      } else if (count < 0) {
        counterDisplay.className = 'text-7xl font-extrabold text-rose-400 tracking-tight transition-all duration-150 transform select-none';
        statusTag.textContent = 'Negative';
        statusTag.className = 'text-xs font-semibold text-rose-500 uppercase tracking-wider mt-2';
      } else {
        counterDisplay.className = 'text-7xl font-extrabold text-indigo-400 tracking-tight transition-all duration-150 transform select-none';
        statusTag.textContent = 'Zero';
        statusTag.className = 'text-xs font-semibold text-slate-500 uppercase tracking-wider mt-2';
      }
    }

    btnIncrement.addEventListener('click', () => {
      count++;
      updateCounterUI();
    });

    btnDecrement.addEventListener('click', () => {
      count--;
      updateCounterUI();
    });

    btnReset.addEventListener('click', () => {
      count = 0;
      updateCounterUI();
    });

    // Support keyboard shortcuts (Up arrow / Right arrow to increment, Down arrow / Left arrow to decrement)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
        count++;
        updateCounterUI();
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
        count--;
        updateCounterUI();
      } else if (e.key === 'r' || e.key === 'R') {
        count = 0;
        updateCounterUI();
      }
    });
  </script>
</body>
</html>
